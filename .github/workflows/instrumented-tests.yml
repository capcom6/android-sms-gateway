name: Instrumented Tests

on:
  pull_request: { types: [opened, synchronize, ready_for_review] }
  push: { branches: [master] }

jobs:
  # Device-paired E2E lives behind Android Keystore, whose RSA-OAEP behaviour is
  # API-level dependent, so a JVM unit test cannot cover it - build-apk.yml only runs
  # `./gradlew test`. These levels are the ones that matter: 25 exercises the pre-M
  # KeyPairGeneratorSpec branch, 30 is M+ on the Keystore1 provider, and 35 is the
  # first level on which Keystore2 enforces the MGF1 digest against the key's
  # authorised set. Dropping any of them silently re-opens the MGF1 regression that
  # shipped broken in v1.77.0.
  encryption:
    strategy:
      fail-fast: false
      matrix:
        api-level: [25, 30, 35]
    name: Instrumented tests (API ${{ matrix.api-level }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JAVA 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17

      - name: Cache Gradle and wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Setup Google Services
        run: echo ${{ secrets.google-services-json }} | base64 --decode > ./app/google-services.json

      - name: Grant KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 7
