name: Build APK

on:
  workflow_call:
    inputs:
      version-name:
        required: true
        type: string
      build-type:
        required: true
        type: string
    secrets:
      google-services-json:
        required: true
      signing-key-store-base64:
        required: true
      signing-key-alias:
        required: true
      signing-key-password:
        required: true
      signing-store-password:
        required: true
  workflow_dispatch:
    inputs:
      version-name:
        description: 'Version name (a leading "v" is stripped)'
        required: true
        default: 'manual'
      build-type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - insecure

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JAVA 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17

      - name: Cache Gradle and wrapper
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.google-services-json || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Fork PRs and secretless runs decode an empty secret into an empty
          # file, which makes the google-services plugin fail with
          # "Malformed root json". Skip the file entirely - the build applies
          # the plugin only when the file exists.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > ./app/google-services.json
          fi

      - name: Set App Version
        run: |
          export VERSION_NAME='${{ inputs.version-name }}'
          sed -i "s/versionName.*/versionName \"${VERSION_NAME#v}\"/" app/build.gradle
          sed -i "s/versionCode.*/versionCode $(( ($(date +%s) - $(date -d "2022-06-15" +%s)) / 86400 ))/" app/build.gradle

      - name: Test
        run: ./gradlew test

      #1
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.signing-key-store-base64 || secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_KEY_STORE_PATH: app/keystore.jks

        run: |
          # Leave keystore.jks absent instead of creating an empty one, so
          # the build falls back to an unsigned APK.
          if [ -n "$ENCODED_STRING" ]; then
            echo $ENCODED_STRING > keystore-b64.txt
            base64 -d keystore-b64.txt > $SIGNING_KEY_STORE_PATH
          fi

      #2
      - name: Build ${{ inputs.build-type }} apk
        env:
          SIGNING_KEY_STORE_PATH: app/keystore.jks
          SIGNING_KEY_ALIAS: ${{ secrets.signing-key-alias || secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.signing-key-password || secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.signing-store-password || secrets.SIGNING_STORE_PASSWORD }}
          TARGET: ${{ inputs.build-type }}
        run: ./gradlew assemble${TARGET^}

      - name: Build ${{ inputs.build-type }} bundle
        env:
          SIGNING_KEY_STORE_PATH: app/keystore.jks
          SIGNING_KEY_ALIAS: ${{ secrets.signing-key-alias || secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.signing-key-password || secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.signing-store-password || secrets.SIGNING_STORE_PASSWORD }}
          TARGET: ${{ inputs.build-type }}
        run: ./gradlew bundle${TARGET^}
      #3
      - name: Upload ${{ inputs.build-type }} Build to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build-type }}-artifacts
          path: |
            app/build/outputs/apk/${{ inputs.build-type }}/
            app/build/outputs/bundle/${{ inputs.build-type }}/
