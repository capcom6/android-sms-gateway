name: Release

on:
  pull_request: { types: [opened, synchronize, ready_for_review] }
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        build-type: [release, insecure]
    name: Build ${{ matrix.build-type }}
    # Manual runs are not pull_request events - build them too; PR builds run
    # for every non-draft PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/build-apk.yml
    with:
      version-name: ${{ github.sha }}
      build-type: ${{ matrix.build-type }}
    secrets:
      google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
      signing-key-store-base64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
      signing-key-alias: ${{ secrets.SIGNING_KEY_ALIAS }}
      signing-key-password: ${{ secrets.SIGNING_KEY_PASSWORD }}
      signing-store-password: ${{ secrets.SIGNING_STORE_PASSWORD }}

  release:
    runs-on: ubuntu-latest
    # Manual runs are not pull_request events - run them too.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: [build]
    # Fork PRs run without repository secrets: the artifact upload and the
    # download links would fail or point nowhere, so guard on AWS credentials.
    env:
      AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Download insecure artifacts
        uses: actions/download-artifact@v4
        with:
          name: insecure-artifacts

      - name: Upload to S3
        if: env.AWS_KEY_ID != ''
        uses: capcom6/upload-s3-action@master
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          aws_key_id: ${{ secrets.AWS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          aws_bucket: ${{ secrets.AWS_BUCKET }}
          endpoint: ${{ secrets.AWS_ENDPOINT }}
          source_files: |
            ./apk/play/release/app-play-release.apk
            ./bundle/playRelease/app-play-release.aab
            ./apk/play/insecure/app-insecure.apk
            ./bundle/playInsecure/app-play-insecure.aab
          destination_dir: apk/${{ github.event.pull_request.head.sha || github.sha }}

      - name: Find Comment
        if: env.AWS_KEY_ID != '' && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Pull request artifacts

      - name: Create or update comment
        if: env.AWS_KEY_ID != '' && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🤖 Pull request artifacts

            | file | commit |
            | ---- | ------ |
            | [`app-play-release.apk`](https://s3.sms-gate.app/apk/${{ github.event.pull_request.head.sha }}/app-play-release.apk) | ${{ github.event.pull_request.head.sha }} |
            | [`app-play-release.aab`](https://s3.sms-gate.app/apk/${{ github.event.pull_request.head.sha }}/app-play-release.aab) | ${{ github.event.pull_request.head.sha }} |
            | [`app-play-insecure.apk`](https://s3.sms-gate.app/apk/${{ github.event.pull_request.head.sha }}/app-play-insecure.apk) | ${{ github.event.pull_request.head.sha }} |
            | [`app-play-insecure.aab`](https://s3.sms-gate.app/apk/${{ github.event.pull_request.head.sha }}/app-play-insecure.aab) | ${{ github.event.pull_request.head.sha }} |

          edit-mode: replace
